<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors!</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1 class="game-title">Rock, Paper, Scissors!</h1>
    </header>

    <div class="move-buttons">
        <button id="rock-btn">✊</button>
        <button id="paper-btn">✋</button>
        <button id="scissors-btn">✌️</button>
    </div>

    <div class="choices">
        <div class="player">
            <h1>You chose:</h1>
            <p id="player-choice"></p>
        </div>

        <div class="computer">
            <h1>Computer chose:</h1>
            <p id="computer-choice"></p>
        </div>
    </div>
        
    <div id="results"></div>
    <div id="scores">Player 0 : 0 Computer</div>
    <div id="winner"></div>

    <script src="script.js"></script>
</body>
</html>
